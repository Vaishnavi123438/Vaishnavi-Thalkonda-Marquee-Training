<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: grid;
      grid-template-columns: 1fr 3fr 1fr;
      grid-template-rows: auto 300px auto;
      grid-template-areas:
        "header header header"
        "Rajasthan Rajasthan Rajasthan"
        "Bihar Uttarakhand";
      gap: 5px;
      height: 100vh;
      text-align: center;
      font-size: 20px;
    }

    .kashmeer{
      grid-area: kashmeer;
      background: lightgreen;
    }

    .sidebar {
      grid-area: aside;
      background: lightyellow;
    }

    .main {
      grid-area: main;
      background: skyblue;
    }

    .side {
      grid-area: nav;
      background: pink;
    }

    .footer {
      grid-area: footer;
      background: plum;
    }

    .container > div {
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #333;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="Kashmeer">
    <div class=""
  </div>
  <div class="aside">sidebar</div>
  <div class="main">main</div>
  <div class="footer">footer</div>
</div>

</body>
</html>
