<!DOCTYPE html>
<html>
<head>
  <style>
   .container{
    width:900px;
    grid-template-columns:3fr 1fr 1fr;
    grid-template-rows:150px 150px 180px;
    gap:15px;
    display:grid;
   } 
   .item{
    border:2px solid black;
    background:lightblue;
  }
  .item1{
    grid-column:1;
    grid-row:1;

  }
  .item2{
    grid-column:1;
    grid-row:2;
  }
  .item3{
    grid-column:2;
    grid-row:1/3;
  }
  .item4{
    grid-column:3;
    grid-row:1;
  }
  .item5{
    grid-column:3;
    grid-row:2;
  }
  .item6{
    grid-column:1/4;
    grid-row:3;
  }

    
  </style>
</head>
<body>

<div class="container">
  <div class="item item1">Box 1</div>
  <div class="item item2">Box 2</div>
  <div class="item item3">Box 3</div>
  <div class="item item4">Box4</div>
  <div class="item item5">Box5</div>
  <div class="item item6">Box6</div>
</div>

</body>
</html>
