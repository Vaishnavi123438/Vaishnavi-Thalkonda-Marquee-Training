
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar</title>

<style>
    .parent{
        height:100px;
        width:850px;
        border: 2px solid black;
        background-color:grey;
        border-radius:20px;
        position:fixed;
    }
    .logo{
       height:50px;
        width:50px;
        border: 2px solid black;
        background-color: green;
        display:inline-block;
        border-radius:50%
       
    }
    .search{
      height:50px;
        width: 80px;
        border: 2px solid black;
        background-color: red;
        display:inline-block;
        border-radius:20px;
        margin-top: 10px;
    }
    .rectangle{
       height:70px;
        width:300px;
        border: 2px solid black;  
        background-color:black;
        border-radius:20px;
        margin-top:10px;
        display:inline-block;
    }
    .search button{
         height:40px;
        width:100px;
        border: 2px solid black; 
        display:inline-block;
    }
    .absolute{
      height:90px;
        width:100px;
        border: 2px solid black; 
        background-color:aqua;
        border-radius:20px;
        margin-top:10px;
    }
        

</style>
</head>
<body>
    <div class="parent">
     <div class="logo"></div> 
     <div class="search"></div>
     <div class="search"></div>
     <div class="search"></div>
     <div class="search"></div>
     <div class="rectangle"></div>
     <div class="search button"></div>
    </div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    <div class="absolute"></div>
    

</body>
</html>
