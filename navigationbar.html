<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar</title>
</head>
<style>
    .rectangle{
        height:90px;
        width:700px;
        border:2px solid black;
        display:flex;
        flex-direction:row-reverse;
        justify-content:space-evenly;
        border-radius:20px;
        background-color:yellow;
       }
.logo{
    height:70px;
    width:70px;
    border:2px solid black;
    background-color:green;
    background-image:url("vaish.png");
    background-size:contain;
    object-fit:cover;
    margin-top:10px;
    margin-left:10px;
    border-radius:50%;
}
.innerbox{
    height:50px;
    width:70px;
    border:2px solid black;
    background-color:darkblue;
    border-radius:20px;
    margin-top:20px;
    display:inline-block;
}
.longbar{
    height:50px;
    width:200px;
    border-radius:20px;
    border:2px solid white;
    background-color: black;
    margin-top:20px;
}
.search{
    height:50px;
    width:70px;
    border-radius:50%;
    border:2px solid black;
    background-color: red;
    margin-top:20px;
}




</style>
<body>
    <div class="rectangle">
    <div class="logo"></div>
    <div class="one innerbox"></div>
    <div class="two innerbox"></div>
    <div class="three innerbox"></div>
    <div class="four innerbox"></div>
    <div class="longbar"></div>
    <div class="search"></div>
    </div>
    
</body>
</html>
