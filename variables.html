<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root{
        --mainColor:darkblue;
        --defaultBorder:2px solid red;
        --vaishnavi:yellow;
        
    }
    .box{
        height:500px;
        width:600px;
        border: 2px solid black;
        background-color:grey;
        
    }
    .rectangle1{
        height:100px;
        width:250px;
        border: var(--defaultBorder);
        margin-top:30px;
        margin-left:20px;
        display:inline-block;
        border-radius:20px;
        background-color:var(--mainColor);
    }
    .rectangle2{
        height:100px;
        width:250px;
        border:var(--defaultBorder);
        border-radius:20px;
        display: inline-block;
        background-color:var(--mainColor);
       
    }
    .bigrectangle{
        height:200px;
        width: 500px;
        border: 2px solid black; 
        margin-left:20px;
        margin-top:30px;
        border-radius:20px;
        background-color:var(--vaishnavi)
    }
    .circle{
      height:80px;
        width: 80px;
        border: 2px solid black; 
        border-radius:50%; 
        margin-left:250px; 
        margin-top:20px;
    }
</style>
<body>
    <div class="box">
     <div class="rectangle1"></div>
     <div class="rectangle2"></div> 
     <div class="bigrectangle"></div>
     <div class="circle"></div>
     
    </div>
    <div class="two"></div>
    <div class="three"></div>
    <div class="four"></div>
</body>
</html>
