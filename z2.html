<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root{
        --mainColor:darkblue;
        --defaultBorder:2px solid red;
        --vaishnavi:yellow;
        --star:red;
        --vaish:green;
        --shinchan:aqua;
    }
    
    .box1{
        height:100px;
        width:100px;
        border: 2px solid black;
        background-color:var(--mainColor);
        display:inline-block;
        position:relative;
        top:30px;
        left:30px;
        z-index:5;
        position:fixed;
        border-radius:20px;
        }
        .box2{
        height:100px;
        width:100px;
        border: 2px solid black;
        background-color:var(--vaishnavi);
        position:relative;
        display:inline-block;
        top:100px;
        left:100px;
        z-index:4;
        position:fixed;
        border-radius:20px;
        }
        .box3{
         height:100px;
        width:100px;
        border: 2px solid black;
        background-color:var(--star);
        display:inline-block;
        position:relative;
        top:150px;
        left:150px;
        z-index:3;
        border-radius:20px;
       }
       .box4{
        height:100px;
        width:100px;
        border: 2px solid black;
        background-color:var(--vaish);
        display:inline-block;
        position:relative;
        top:210px;
        left:210px;
        z-index:2;
        position:fixed;
        border-radius:20px;
       }
       .box5{
        height:100px;
        width:100px;
        border: 2px solid black;
        background-color:var(--shinchan);
        display:inline-block;
        position:relative;
        top:260px;
        left:260px;
        z-index:1;
        position:fixed;
        border-radius:20px;
       }
</style>
<body>
    
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    </div>
</body>
</html>
