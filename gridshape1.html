<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container{
    width:300px;
    display:grid;
    gap:10px;
    grid-template-columns:1fr 1fr;
    grid-template-rows:80px 80px 80px;
    font-size:20px;
    align-content: center;
    }
    .item{
        background-color: aqua;
        border:2px solid black;
    }
    .item1{
        grid-column:1;
        grid-row:1;
        background-color: red;
    }
    .item2{
        grid-column:2;
        grid-row:1;
        background-color: yellow;
    }
    .item3{
        grid-column:1/3;
        grid-row:2;
    }
    .item4{
        grid-column:1;
        grid-row:3;
        background-color: greenyellow;
    }
    .item5{
        grid-column:2;
        grid-row:3;
        background-color: green;
    }
</style>
<body>
    <div class="container">
        <div class="item item1">Kashmeer</div>
        <div class="item item2">Madhya Pradesh</div>
        <div class="item item3">Rajasthan</div>
        <div class="item item4">Bihar</div>
        <div class="item item5">Uttarakhand</div>
    </div>
    
</body>
</html>
