<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
:root{
    --mainColor:red;
    --defaultBorder:black;
    --vaish:yellow;
    --vaishnavi:darkblue;

}
.box{
    height:100px;
    width:100px;
    background-color:var(--mainColor);
    border:2px solid black;
    display:inline-block;
    border-radius:20px;
}
.box1{
    height:100px;
    width:100px;
    background-color:var(--vaish);
    border:2px solid black;
    position:relative;
    left:70px;
    z-index:5;
    border-radius:20px;
}
.box2{
    height:100px;
    width:100px;
    background-color:var(--mainColor);
    border:2px solid black;
    position:relative;
    left:140px;
    z-index:5;
    border-radius:20px;
}
.box3{
    height:100px;
    width:100px;
    background-color:var(--vaish);
    border:2px solid black;
    position:relative;
    left:210px;
    z-index:5;
    border-radius:20px;
}
</style>
<body>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>
