<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
       height:500px;
       width:600px;
       border:2px solid black;
    }
    .container1{
        display:grid;
        grid-template-columns:50px;
        grid-template-rows:50px;
        background-color: red;
    }
    .items{
         grid:1/3;
    }
</style>
<body>
    <div class="container">
        <div class="container1"></div>
    </div>
    
</body>
</html>
