<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.container{
     width:300px;
    display:grid;
    grid-template-columns:100px 150px 100px ;
    grid-template-rows:50px 50px 50px;
    place-items:center;

}
.item{
    background-color:aliceblue;
    border:2px solid black;
}
.item1{
    grid-column:1;
    grid-row:1;
    height:20px;
    width:20px;
    justify-self:start;
    }
    .item2{
      grid-column:2;
      grid-row:1;
      height:20px;
      width:20px;
      justify-self:end;
     }
     .item3{
        grid-column:3;
        grid-row:1;
        height:20px;
      width:20px;
      align-self:end;
     }
     .item4{
        grid-column:1;
        grid-row:2;
        height:20px;
      width:20px;
      align-self:start;
     }
.item5{
        grid-column:2;
        grid-row:2;
        height:20px;
      width:20px;
      justify-self:start;
     }
.item6{
        grid-column:3;
        grid-row:2;
        height:20px;
      width:20px;
      justify-self:end;
     }
     .item7{
        grid-column:1;
        grid-row:3;
        height:20px;
      width:20px;
      justify-self:start;
     }
     .item8{
        grid-column:2;
        grid-row:3;
        height:20px;
      width:20px;
      align-self:start;
     }
     .item9{
        grid-column:3;
        grid-row:3;
        height:20px;
      width:20px;
      justify-self:end;
     }
</style>
<body>
    <div class="container">
        <div class="item item1 "></div>
        <div class="item item2"></div>
         <div class="item item3"></div>
        <div class="item item4"></div>
        <div class="item item5"></div>
        <div class="item item6"></div>
         <div class="item item7"></div>
        <div class="item item8"></div>
        <div class="item item9"></div>


    </div>
    
</body>
</html>
